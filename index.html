<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Menú en línea de Nori House Sushi">
  <title>Nori House | Menú</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header border-bottom">
    <nav class="container py-3" aria-label="Navegación principal">
      <a class="navbar-brand d-inline-flex align-items-center gap-2" href="#menu" aria-label="Nori House, volver al menú"><span class="brand-mark" aria-hidden="true">の</span><span>Nori House</span></a>
    </nav>
  </header>
  <main>
    <section class="menu-section" id="menuScreen" aria-labelledby="menuTitle">
      <div class="container">
        <div class="section-heading"><div><span class="eyebrow">Sushi preparado al momento</span><h1 id="menuTitle">Nuestro menú</h1></div><p>Explora nuestra selección y abre un producto para conocer todos sus detalles.</p></div>
        <div class="category-list" id="categoryFilters" aria-label="Filtrar por categoría"></div>
        <div class="row g-4" id="productGrid" aria-live="polite"></div>
        <div class="loading-state" id="menuState" role="status"><div class="spinner-border" aria-hidden="true"></div><p>Cargando menú…</p></div>
      </div>
    </section>
    <section class="detail-section d-none" id="detailScreen" aria-labelledby="detailTitle">
      <div class="container"><a class="back-link" href="#menu"><span aria-hidden="true">←</span> Volver al menú</a><div id="productDetail" aria-live="polite"></div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
