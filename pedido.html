<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario de pedidos de Nori House Sushi">
  <title>Nori House | Nuevo pedido</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink: #18201d; --muted: #65706b; --paper: #fffdfa; --accent: #d9483b; --accent-dark: #b8352b; --line: #dedbd4; --success: #1f6b45; --error: #a52d26; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 12% 10%, rgba(217, 72, 59, .11), transparent 28rem), #f4f1eb; font-family: "Open Sans", sans-serif; }
    header { padding: 1.25rem max(1.5rem, calc((100% - 68rem) / 2)); border-bottom: 1px solid rgba(24, 32, 29, .1); background: rgba(255, 253, 250, .86); }
    .brand { color: var(--ink); font: 700 1.2rem "Poppins", sans-serif; text-decoration: none; }
    .brand span { color: var(--accent); }
    main { display: grid; place-items: center; padding: 3rem 1.25rem; }
    .card { width: min(100%, 42rem); padding: clamp(1.5rem, 5vw, 3rem); border: 1px solid var(--line); border-radius: 1.25rem; background: var(--paper); box-shadow: 0 1.25rem 3rem rgba(35, 29, 24, .08); }
    .eyebrow { margin: 0 0 .5rem; color: var(--accent); font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font: 700 clamp(2rem, 6vw, 3rem)/1.1 "Poppins", sans-serif; }
    .intro { margin: .75rem 0 2rem; color: var(--muted); }
    form { display: grid; gap: 1.25rem; }
    label { display: grid; gap: .45rem; font-weight: 700; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid var(--line); border-radius: .65rem; color: var(--ink); background: #fff; }
    textarea { min-height: 8rem; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 3px solid rgba(217, 72, 59, .14); }
    button { min-height: 3.25rem; border: 0; border-radius: .65rem; color: #fff; background: var(--accent); font-weight: 700; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: .65; }
    .message { display: none; margin: 1.25rem 0 0; padding: 1rem; border-radius: .65rem; overflow-wrap: anywhere; }
    .message.success { display: block; color: var(--success); background: #e8f4ed; }
    .message.error { display: block; color: var(--error); background: #fae9e7; }
  </style>
</head>
<body>
  <header><a class="brand" href="index.html"><span>の</span> Nori House</a></header>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">Orden en línea</p>
      <h1 id="page-title">Haz tu pedido</h1>
      <p class="intro">Completa los datos y enviaremos tu orden a cocina.</p>
      <form id="pedido-form">
        <label for="cliente">Cliente
          <input id="cliente" name="cliente" type="text" autocomplete="name" required>
        </label>
        <label for="estado">Estado
          <select id="estado" name="estado" required><option value="pendiente">Pendiente</option></select>
        </label>
        <label for="hora">Hora
          <input id="hora" name="hora" type="time" required>
        </label>
        <label for="productos">Productos
          <textarea id="productos" name="productos" placeholder="Escribe los productos y cantidades que deseas" required></textarea>
        </label>
        <button id="submit-button" type="submit">Enviar pedido</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const supabase = createClient(
      "https://yqilxusgnttmatpvqbfq.supabase.co",
      "sb_publishable_lGBgaHr6peJZf7Ap8JdoqA_7Hxpbni5"
    );
    const form = document.querySelector("#pedido-form");
    const button = document.querySelector("#submit-button");
    const message = document.querySelector("#message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "Enviando…";
      message.className = "message";
      message.textContent = "";

      const formData = new FormData(form);
      const pedido = {
        cliente: formData.get("cliente"),
        estado: formData.get("estado"),
        hora: formData.get("hora"),
        productos: formData.get("productos")
      };

      try {
        const { error } = await supabase.from("pedidos").insert(pedido);
        if (error) throw error;
        form.reset();
        message.textContent = "¡Gracias! Tu pedido fue enviado correctamente.";
        message.className = "message success";
      } catch (error) {
        message.textContent = `No se pudo guardar el pedido: ${error.message || String(error)}`;
        message.className = "message error";
      } finally {
        button.disabled = false;
        button.textContent = "Enviar pedido";
      }
    });
  </script>
</body>
</html>
